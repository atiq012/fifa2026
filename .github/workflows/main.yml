name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  FTP-Deploy-Action:
    name: FTP-Deploy-Action
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Ensure portal upload dir writable
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            mkdir -p /home/myportal/public_html/public/public/resources/images/userimages
            chmod 775 /home/myportal/public_html/public/public/resources/images/userimages

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}

          server-dir: /

          exclude: |
            **/.git*
            **/node_modules/**
            **/vendor/**
            **/.env*
            **/.github/**
            **/tests/**
            **/phpunit.xml
            **/.phpunit.cache/**
            **/.idea/**
            **/.vscode/**
            **/.fleet/**
            **/docker/**
